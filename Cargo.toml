[package]
name = "breadcrumb"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first, git-backed knowledge vault for AI coding agents"
license = "MIT"

[lib]
name = "breadcrumb"
path = "src/lib.rs"

[[bin]]
name = "breadcrumb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
