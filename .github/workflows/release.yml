name: release

# Push a tag like v0.2.0 to build every platform and publish the release that `breadcrumb upgrade` and the install
# scripts download. The binaries report the tag's version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.2.0 (created on the current main if missing)"
        required: true

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "breadcrumb $TAG" --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: breadcrumb-windows-x64.zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: breadcrumb-linux-x64.tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: breadcrumb-macos-arm64.tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, asset: breadcrumb-macos-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Version from the tag
        shell: bash
        run: |
          v="${{ needs.create.outputs.tag }}"
          v="${v#v}"
          V="$v" perl -0pi -e 's/^version = ".*?"/version = "$ENV{V}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/${{ matrix.asset }}" breadcrumb.exe crumb.exe
          else
            tar -czf "$GITHUB_WORKSPACE/${{ matrix.asset }}" breadcrumb crumb
          fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create.outputs.tag }}" "${{ matrix.asset }}" --clobber
